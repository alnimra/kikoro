name: TestFlight on main push

# Kikoro fork addition. Paseo's existing release-mobile.yml only fires on `v*` tags
# (paseo's "tag → App Store" cadence). This workflow fires on every push to main
# that touches the iOS app or its workspace deps, builds with the kikoro testflight
# profile, and auto-submits to TestFlight. Matches the old kikoro CI pattern.
#
# To skip a build for a given commit, push to a feature branch and merge later;
# main pushes always trigger.
#
# Verified auto-triggering 2026-05-13 after fixing Expo project base directory
# from `/` to `packages/app` (kikoro is a paseo monorepo; workflows live at
# packages/app/.eas/workflows/ not at repo root).

on:
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/server/**"
      - "packages/highlight/**"
      - "packages/expo-two-way-audio/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: testflight

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight
